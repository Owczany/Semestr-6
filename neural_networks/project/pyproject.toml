[project]
name = "american-sign-language"
version = "1.0.0"
description = "Neural network experiments for American Sign Language recognition."
authors = [
    { name = "Piotr Pijanowski" },
]
requires-python = ">=3.10"
dependencies = [
    "fiddle>=0.3.0",
    "matplotlib>=3.10.0",
    "mediapipe>=0.10.20",
    "numpy>=2.0.0",
    "opencv-python>=4.11.0.86",
    "pandas>=2.2.0",
    "plotly>=6.1.0",
    "torch>=2.7.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
]
